<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bağlantı bekleniyor — Diyetisyen Ezgi</title>
  <style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a}main{max-width:28rem;padding:2rem}h1{font-size:1.5rem}p{line-height:1.6}button{background:#4f46e5;color:white;border:0;border-radius:.5rem;padding:.8rem 1.2rem;font:inherit;cursor:pointer}</style>
</head>
<body>
  <main>
    <h1>Uygulamaya şu anda ulaşılamıyor</h1>
    <p id="status" role="status">Sayfayı yeniden açmayı deneyebilirsiniz.</p>
    <button type="button" onclick="location.reload()">Tekrar dene</button>
  </main>
  <script>
    if (navigator.onLine === false) {
      document.getElementById("status").textContent = "Cihazınız çevrimdışı. Bağlantı geri geldiğinde sayfa yeniden açılacak.";
    }
    navigator.serviceWorker?.addEventListener("message", (event) => {
      if (event.data?.type === "NOTIFICATION_FOCUSED" && navigator.onLine !== false) location.reload();
    });
    window.addEventListener("online", () => location.reload(), { once: true });
  </script>
</body>
</html>
